<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- manifest 由 vite-plugin-pwa 在构建时注入 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // App 外壳（安卓 WebView）标记：给 <html> 挂 .app-shell 供样式层区分环境
      // （收敛触摸行为：禁长按选择 / 滚动回弹 / 滚动条；浏览器不受影响）。
      // 放在最前面尽早执行，避免样式闪变；"; wv" 是 Android WebView 的 UA 标志。
      if (navigator.userAgent.includes('; wv')) {
        document.documentElement.classList.add('app-shell')
      }
    </script>
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="个人骑行记录与评分看板:记录骑行数据,结合天气、空气质量与路线海拔坡度计算综合评分,并以趋势图、速度曲线、海拔剖面、评分雷达与地图轨迹展示。"
    />
    <title>骑行评分监测看板</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
